# Main server configuration
server {
    listen 80;
    server_name _;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Telegram webhook endpoint
    location /webhook/ {
        limit_req zone=telegram burst=50 nodelay;
        
        proxy_pass http://telegram_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API endpoints
    location /api/v1/messages/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://messaging_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/v1/agents/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://agent_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;  # Longer timeout for AI requests
        proxy_read_timeout 120s;
    }

    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://api_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Admin panel or dashboard (optional)
    location /admin/ {
        limit_req zone=api burst=5 nodelay;
        
        # Optional: route to an admin interface
        return 503 "Admin panel not available";
    }

    # Default location - return API info
    location / {
        return 200 '{"service": "Dementia Support Bot", "version": "1.0", "status": "running"}';
        add_header Content-Type application/json;
    }
}

